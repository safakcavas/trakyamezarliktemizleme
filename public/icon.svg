<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Left Leaf -->
  <path d="M 64 88 C 42 84 32 64 36 44 C 48 42 66 56 64 88 Z" fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Right Leaf -->
  <path d="M 64 88 C 86 84 96 64 92 44 C 80 42 62 56 64 88 Z" fill="url(#leafGrad2)"/>
  <!-- Center Sprout Stem -->
  <path d="M 64 96 L 64 60" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center Sprout Bud -->
  <path d="M 64 62 C 58 50 64 36 64 36 C 64 36 70 50 64 62 Z" fill="#6ee7b7"/>

  <!-- Sparkling cleanliness stars -->
  <!-- Top Right Big Sparkle -->
  <path d="M 88 26 Q 88 36 98 36 Q 88 36 88 46 Q 88 36 78 36 Q 88 36 88 26 Z" fill="url(#sparkleGrad)"/>
  <!-- Top Left Small Sparkle -->
  <path d="M 36 30 Q 36 35 41 35 Q 36 35 36 40 Q 36 35 31 35 Q 36 35 36 30 Z" fill="#fef08a" opacity="0.9"/>
  <!-- Tiny bottom sparkle -->
  <circle cx="96" cy="56" r="3" fill="#fef08a" opacity="0.85"/>
</svg>